      --accent-blue: #a855f7;
      --accent-magenta: #d946ef;

      --accent-purple: #c026d3;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --shadow-glow: 0 10px 25px -5px rgba(192, 38, 211, 0.35);
      --glass-border: 1px solid rgba(192, 38, 211, 0.25);
    }

    [data-theme='light'] {
      --bg-primary: #f6f3fc;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #f1eafd;

      --text-muted: #8b5cf6;
      --accent-blue: #9333ea;
      --accent-magenta: #c026d3;
      --accent-cyan: #0284c7;
      --accent-purple: #7e22ce;
      --accent-emerald: #059669;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --shadow-glow: 0 10px 25px -5px rgba(168, 85, 247, 0.2);
      --glass-border: 1px solid rgba(168, 85, 247, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; transition: background 0.3s; }

    .glass-panel { background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 12px; }
    .glass-card { background: var(--bg-card); backdrop-filter: blur(10px); border: var(--glass-border); border-radius: 12px; transition: all 0.2s; }
    .glass-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow-glow); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-clos { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-installation { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-activation { background: rgba(6, 182, 212, 0.15); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-delivered { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-cancelled { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .badge-twal { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3); }

    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1500px; }
    .custom-table th { background: rgba(15, 23, 42, 0.4); padding: 10px 14px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); text-align: left; white-space: nowrap; }
    .custom-table td { padding: 10px 14px; font-size: 0.83rem; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
    .custom-table tr:hover td { background: var(--bg-card-hover); }
    .table-wrap { overflow-x: auto; border-radius: 12px; }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 3px; }
    .table-wrap::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.4); border-radius: 3px; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.7); }
    .sticky-col { position: sticky; right: 0; background: var(--bg-secondary); z-index: 2; box-shadow: -3px 0 8px rgba(0,0,0,0.2); }
  </style>
</head>

    // ── ExcelTab Component (needs its own hooks, cannot be inside App render) ──
    function ExcelTab({ orders, setOrders }) {
      const [excelStatus, setExcelStatus] = React.useState(null);
      const fileInputRef = React.useRef(null);

      const handleFileUpload = (file) => {
        if (!file) return;
        const name = file.name.toLowerCase();
        if (!name.endsWith('.xlsx') && !name.endsWith('.xls') && !name.endsWith('.csv')) {
          setExcelStatus({ type: 'error', msg: 'Please select a valid Excel file (.xlsx, .xls) or CSV.' });
          return;
        }
        setExcelStatus({ type: 'loading', msg: `Reading "${file.name}"...` });
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
            if (rows.length === 0) {
              setExcelStatus({ type: 'error', msg: 'No data rows found in the Excel file.' });
              return;
            }
            const mapped = rows.map((row, i) => {
              const get = (...keys) => {
                for (const k of keys) {
                  const found = Object.keys(row).find(rk => rk.toLowerCase().replace(/[\s_\-]/g,'').includes(k.toLowerCase().replace(/[\s_\-]/g,'')));
                  if (found && row[found] !== '') return String(row[found]);
                }
                return '';
              };
              return {
                id: 'xl-' + Date.now() + '-' + i,
                sl_no: get('sl','sno','serial') || String(i + 1),
                ki_id: get('kiid','ki id','kicid','orderid','id') || `IMPORT-${i+1}`,
                order_received: get('order received','orderreceived','date','received') || '',
                region: get('region') || 'CENTRAL',
                city: get('city','location') || '',
                customer_name: get('customer name','customername','customer','client') || '',
                customer_contact: get('contact','phone','mobile') || '',
                bw: get('bw','bandwidth','speed') || '',
                circuit_id: get('circuit','circuitid','circuit id') || '',
                order_number: get('order number','ordernumber','order no') || '',
                los_status: get('los status','losstatus','los') || '',
                los_id: get('los id','losid') || '',
                cwo_date: get('cwo date','cwodate','cwo') || '',
                installation_start: get('installation start date','installationstart','start date','installation start') || '',
                installation_complete: get('installation complete date','installationcomplete','complete date','installation complete') || '',
                delivery_date: get('delivery date','deliverydate','delivery') || '',
                order_status: get('active status','workflow status','status','orderstatus') || 'Under MW Installation',
                assigned_to: get('engineer','assigned','assignedto') || 'Unassigned',
                priority: get('priority') || 'Medium',
                remarks: get('remarks','notes','comment') || '',
                is_cancelled: ['true','yes','1'].includes(get('cancelled','iscancelled','is cancelled').toLowerCase())
              };
            });
            setOrders(mapped);
            setExcelStatus({ type: 'success', msg: `✅ Successfully imported ${mapped.length} orders from "${file.name}" (Sheet: ${sheetName})` });
          } catch (err) {
            setExcelStatus({ type: 'error', msg: `Failed to parse file: ${err.message}` });
          }
        };
        reader.onerror = () => setExcelStatus({ type: 'error', msg: 'Failed to read file.' });
        reader.readAsArrayBuffer(file);
      };

      const handleDrop = (e) => { e.preventDefault(); handleFileUpload(e.dataTransfer.files[0]); };

      const handleExportCSV = () => {
        const headers = ['SL','KI ID','Order Received','Region','City','Customer Name','BW','LOS Status','CWO Date','Installation Start Date','Installation Complete Date','Delivery Date','Active Status','Engineer','Circuit ID','Order Number','Remarks'];
        const rows = orders.map(o => [o.sl_no,o.ki_id,o.order_received,o.region,o.city,o.customer_name,o.bw,o.los_status,o.cwo_date,o.installation_start,o.installation_complete,o.delivery_date,o.order_status,o.assigned_to,o.circuit_id,o.order_number,o.remarks].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'KI_Orders_Export.csv'; a.click();
        URL.revokeObjectURL(url);
      };

      const statusStyle = excelStatus ? {
        padding: '0.85rem 1.25rem', borderRadius: '8px', fontWeight: 600, fontSize: '0.88rem',
        background: excelStatus.type === 'success' ? 'rgba(16,185,129,0.15)' : excelStatus.type === 'error' ? 'rgba(244,63,94,0.15)' : 'rgba(59,130,246,0.15)',
        border: `1px solid ${excelStatus.type === 'success' ? 'rgba(16,185,129,0.4)' : excelStatus.type === 'error' ? 'rgba(244,63,94,0.4)' : 'rgba(59,130,246,0.4)'}`,
        color: excelStatus.type === 'success' ? '#10b981' : excelStatus.type === 'error' ? '#f43f5e' : 'var(--accent-blue)'
      } : null;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem' }}>
            <div>
              <h2 style={{ fontSize: '1.25rem', fontWeight: 800 }}>📑 Excel Workbook Import & Export Engine</h2>
              <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>Upload Excel files (.xlsx) to replace live order data, or export current data as CSV.</p>
            </div>
            <button onClick={handleExportCSV} style={{ padding: '0.5rem 1.1rem', background: 'linear-gradient(135deg, #10b981, #059669)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, fontSize: '0.85rem', cursor: 'pointer' }}>
              📥 Export to CSV ({orders.length} orders)
            </button>
          </div>

          {excelStatus && <div style={statusStyle}>{excelStatus.msg}</div>}

          <div
            className="glass-panel"
            onDragOver={(e) => e.preventDefault()}
            onDrop={handleDrop}
            style={{ padding: '3rem 2rem', textAlign: 'center', border: '2px dashed var(--border-color)', borderRadius: '16px', background: 'var(--bg-primary)' }}
          >
            <div style={{ fontSize: '3rem', marginBottom: '0.75rem' }}>📊</div>
            <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '0.5rem' }}>Drag & Drop Excel File (.xlsx)</h3>
            <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem', marginBottom: '1.25rem' }}>Supported: .xlsx, .xls, .csv — first sheet will be imported</p>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls,.csv"
              style={{ display: 'none' }}
              onChange={(e) => handleFileUpload(e.target.files[0])}

          <div className="glass-panel" style={{ padding: '1.25rem' }}>
            <h3 style={{ fontSize: '1rem', fontWeight: 700, marginBottom: '0.75rem' }}>📊 Current Data Summary</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: '0.75rem' }}>
              {[
                { label: 'Total Orders', value: orders.length, color: 'var(--accent-blue)' },
                { label: 'Active', value: orders.filter(o => !o.is_cancelled).length, color: '#10b981' },
                { label: 'Cancelled', value: orders.filter(o => o.is_cancelled).length, color: '#f43f5e' },
                { label: 'Assigned', value: orders.filter(o => o.assigned_to && o.assigned_to !== 'Unassigned').length, color: 'var(--accent-cyan)' }
              ].map((s, i) => (
                <div key={i} style={{ textAlign: 'center', padding: '0.75rem', background: 'var(--bg-primary)', borderRadius: '8px', border: '1px solid var(--border-color)' }}>

                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function App() {

      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [darkMode, setDarkMode] = React.useState(true);

      // Account management state — Hassan Saleem as default Super Admin
      const [accounts, setAccounts] = React.useState([

        { id: 'usr-2', name: 'Haroon', role: 'Engineer', email: 'haroon@kreativicon.com' },
        { id: 'usr-3', name: 'Shukoor', role: 'Engineer', email: 'shukoor@kreativicon.com' },

      const [isCreateUserModalOpen, setIsCreateUserModalOpen] = React.useState(false);

      // RESTRICT ENGINEER TABS: Engineers can ONLY access 'dashboard' & 'engineers'
      React.useEffect(() => {
        if (isEngineer && !['dashboard', 'engineers'].includes(activeTab)) {

      // Form state for creating new project connection (Super Admin)
      const [newOrder, setNewOrder] = React.useState({
        sl_no: '',
        ki_id: '',

        region: 'CENTRAL',
        city: 'RIYADH',
        customer_name: '',
        customer_contact: '',
        circuit_id: '',
        order_number: '',
        bw: '10MBPs',
        los_status: 'CLOS',
        los_id: '',
        cwo_date: '',
        installation_start: '',
        installation_complete: '',
        delivery_date: '',
        order_status: 'Under MW Installation',
        assigned_to: 'Haroon',
        priority: 'High',

      // Form state for creating new user account (Super Admin)
      const [newUser, setNewUser] = React.useState({

        role: 'Engineer',
        email: ''

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');

      // Ensure Engineer activeTab stays within allowed tabs

        if (isEngineer && !['dashboard', 'engineers'].includes(activeTab)) {

      // If an Engineer is logged in, show ONLY their assigned projects/orders

      const visibleOrders = React.useMemo(() => {
        if (isEngineer) {
          return orders.filter(o => o.assigned_to === currentAccount.name);
        }
        return orders;
      }, [orders, currentAccount, isEngineer]);

      const activeOrders = visibleOrders.filter(o => !o.is_cancelled);
      const totalCount = visibleOrders.length;
      const activeCount = activeOrders.length;
      const cancelledCount = visibleOrders.filter(o => o.is_cancelled).length;
      const closCount = activeOrders.filter(o => o.los_status === 'CLOS').length;
      const installingCount = activeOrders.filter(o => o.order_status.includes('Installation')).length;
      const deliveredCount = activeOrders.filter(o => o.order_status.startsWith('Delivered')).length;
      const twalCount = activeOrders.filter(o => o.order_status.includes('TWAL')).length;

          remarks: '',
          is_cancelled: false

        alert(`New Project connection "${created.ki_id}" successfully added!`);

                        onChange={(e) => setSelectedOrder({ ...selectedOrder, order_status: e.target.value })}
                        style={{ width: '100%', padding: '0.45rem 0.75rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--accent-amber)', fontWeight: 700 }}
                      >
                        <option value="Under MW Installation">Under MW Installation</option>
                        <option value="Under Activation">Under Activation</option>
                        <option value="Under TWAL Approval">Under TWAL Approval</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Delivered /CR Pending">Delivered / CR Pending</option>
                        <option value="Pending Due to Ip issues at Mobily End">Pending Due to IP issues at Mobily End</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Not Yet Set">Not Yet Set</option>
                      </select>
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem', color: 'var(--text-secondary)' }}>Assigned Engineer</label>
                      <select
                        disabled={!isSuperAdmin}
                        value={selectedOrder.assigned_to || 'Unassigned'}
                        onChange={(e) => setSelectedOrder({ ...selectedOrder, assigned_to: e.target.value })}
                        style={{ width: '100%', padding: '0.45rem 0.75rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                      >
                        {accounts.filter(a => a.role === 'Engineer').map(eng => (
                          <option key={eng.id} value={eng.name}>{eng.name}</option>
                        ))}
                        <option value="Unassigned">Unassigned</option>
                      </select>
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem', color: 'var(--text-secondary)' }}>Is Cancelled Order?</label>
                      <select
                        disabled={!isSuperAdmin}
                        value={selectedOrder.is_cancelled ? 'true' : 'false'}
                        onChange={(e) => setSelectedOrder({ ...selectedOrder, is_cancelled: e.target.value === 'true' })}
                        style={{ width: '100%', padding: '0.45rem 0.75rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: selectedOrder.is_cancelled ? '#f43f5e' : '#10b981', fontWeight: 700 }}
                      >
                        <option value="false">Active Order</option>
                        <option value="true">Cancelled Order</option>
                      </select>
                    </div>

                    <div style={{ gridColumn: 'span 2' }}>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem', color: 'var(--text-secondary)' }}>Circuit ID</label>
                      <input
                        type="text"
                        disabled={!isSuperAdmin}
                        value={selectedOrder.circuit_id || ''}
                        onChange={(e) => setSelectedOrder({ ...selectedOrder, circuit_id: e.target.value })}
                        style={{ width: '100%', padding: '0.45rem 0.75rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                      />
                    </div>

                    <div style={{ gridColumn: 'span 2' }}>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem', color: 'var(--text-secondary)' }}>Remarks / Notes</label>
                      <textarea
                        rows="3"
                        disabled={!isSuperAdmin}
                        value={selectedOrder.remarks || ''}
                        onChange={(e) => setSelectedOrder({ ...selectedOrder, remarks: e.target.value })}
                        style={{ width: '100%', padding: '0.45rem 0.75rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
                      />
                    </div>

                  </div>

                  <div style={{ display: 'flex', gap: '1rem', marginTop: '1.5rem' }}>
                    {isSuperAdmin ? (
                      <button type="submit" style={{ flex: 1, padding: '0.65rem', background: 'linear-gradient(135deg, #10b981, #059669)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, cursor: 'pointer', fontSize: '0.9rem' }}>
                        💾 Save All Changes
                      </button>
                    ) : (
                      <button type="button" onClick={() => setSelectedOrder(null)} style={{ flex: 1, padding: '0.65rem', background: 'var(--accent-blue)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, cursor: 'pointer' }}>
                        Close View
                      </button>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Super Admin Modal: Add New Connection Project */}
          {isAddModalOpen && (
            <div onClick={(e) => e.target === e.currentTarget && setIsAddModalOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', zIndex: 100, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '1rem' }}>
              <div className="glass-panel" style={{ width: '100%', maxWidth: '700px', maxHeight: '90vh', padding: '1.75rem', overflowY: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem', borderBottom: '1px solid var(--border-color)', paddingBottom: '0.75rem' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--accent-blue)' }}>➕ Add New Connection Project</h3>
                  <button onClick={() => setIsAddModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.4rem', cursor: 'pointer' }}>✕</button>
                </div>

                <form onSubmit={handleAddOrderSubmit}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', fontSize: '0.85rem' }}>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>KI ID *</label>
                      <input required type="text" placeholder="e.g. KIC-019-MW-MEL-STC" value={newOrder.ki_id} onChange={(e) => setNewOrder({ ...newOrder, ki_id: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Customer Name *</label>
                      <input required type="text" placeholder="Customer Company Name" value={newOrder.customer_name} onChange={(e) => setNewOrder({ ...newOrder, customer_name: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Order Number</label>
                      <input type="text" placeholder="Order #" value={newOrder.order_number} onChange={(e) => setNewOrder({ ...newOrder, order_number: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Circuit ID</label>
                      <input type="text" placeholder="Circuit ID" value={newOrder.circuit_id} onChange={(e) => setNewOrder({ ...newOrder, circuit_id: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Region</label>
                      <select value={newOrder.region} onChange={(e) => setNewOrder({ ...newOrder, region: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}>
                        <option value="CENTRAL">CENTRAL</option>
                        <option value="EAST">EAST</option>
                        <option value="WEST">WEST</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>City</label>
                      <input type="text" value={newOrder.city} onChange={(e) => setNewOrder({ ...newOrder, city: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Bandwidth (BW)</label>
                      <input type="text" value={newOrder.bw} onChange={(e) => setNewOrder({ ...newOrder, bw: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Active Status</label>
                      <select value={newOrder.order_status} onChange={(e) => setNewOrder({ ...newOrder, order_status: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}>
                        <option value="Under MW Installation">Under MW Installation</option>
                        <option value="Under Activation">Under Activation</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Pending">Pending</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Assign Engineer</label>
                      <select value={newOrder.assigned_to} onChange={(e) => setNewOrder({ ...newOrder, assigned_to: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}>
                        {accounts.filter(a => a.role === 'Engineer').map(eng => (
                          <option key={eng.id} value={eng.name}>{eng.name}</option>
                        ))}
                        <option value="Unassigned">Unassigned</option>
                      </select>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Customer Contact</label>
                      <input type="text" placeholder="Name & Phone" value={newOrder.customer_contact} onChange={(e) => setNewOrder({ ...newOrder, customer_contact: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>CWO Date</label>
                      <input type="date" value={newOrder.cwo_date} onChange={(e) => setNewOrder({ ...newOrder, cwo_date: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Installation Start Date</label>
                      <input type="date" value={newOrder.installation_start} onChange={(e) => setNewOrder({ ...newOrder, installation_start: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Installation Complete Date</label>
                      <input type="date" value={newOrder.installation_complete} onChange={(e) => setNewOrder({ ...newOrder, installation_complete: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.2rem' }}>Delivery Date</label>
                      <input type="date" value={newOrder.delivery_date} onChange={(e) => setNewOrder({ ...newOrder, delivery_date: e.target.value })} style={{ width: '100%', padding: '0.45rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                  </div>

                  <button type="submit" style={{ marginTop: '1.5rem', width: '100%', padding: '0.65rem', background: 'linear-gradient(135deg, #3b82f6, #2563eb)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, cursor: 'pointer' }}>
                    Add Connection Project
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Super Admin Modal: Create User Account (Viewer / Engineer) */}
          {isCreateUserModalOpen && (
            <div onClick={(e) => e.target === e.currentTarget && setIsCreateUserModalOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', zIndex: 100, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '1rem' }}>
              <div className="glass-panel" style={{ width: '100%', maxWidth: '500px', padding: '1.75rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem', borderBottom: '1px solid var(--border-color)', paddingBottom: '0.75rem' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--accent-purple)' }}>👤 Create New User Account</h3>
                  <button onClick={() => setIsCreateUserModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.4rem', cursor: 'pointer' }}>✕</button>
                </div>

                <form onSubmit={handleCreateUserSubmit}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem', fontSize: '0.85rem' }}>
                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.3rem' }}>Full Name *</label>
                      <input required type="text" placeholder="e.g. Tariq Al-Mansoor" value={newUser.name} onChange={(e) => setNewUser({ ...newUser, name: e.target.value })} style={{ width: '100%', padding: '0.5rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.3rem' }}>Role *</label>
                      <select value={newUser.role} onChange={(e) => setNewUser({ ...newUser, role: e.target.value })} style={{ width: '100%', padding: '0.5rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}>
                        <option value="Engineer">Engineer (Assigned Projects Access)</option>
                        <option value="Viewer">Viewer (Read-Only Access)</option>
                        <option value="Super Admin">Super Admin (Full Master Access)</option>
                      </select>
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.3rem' }}>Email Address *</label>
                      <input required type="email" placeholder="e.g. tariq@kreativicon.com" value={newUser.email} onChange={(e) => setNewUser({ ...newUser, email: e.target.value })} style={{ width: '100%', padding: '0.5rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                  </div>

                  <button type="submit" style={{ marginTop: '1.5rem', width: '100%', padding: '0.65rem', background: 'linear-gradient(135deg, #8b5cf6, #7c3aed)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, cursor: 'pointer' }}>
                    Create Account
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
