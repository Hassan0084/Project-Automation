      --accent-blue: #a855f7;

      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;

      --bg-primary: #f6f3fc;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #f1eafd;

      --text-secondary: #6b21a8;
      --text-muted: #8b5cf6;
      --accent-blue: #9333ea;
      --accent-magenta: #c026d3;
      --accent-cyan: #0284c7;
      --accent-purple: #7e22ce;
      --accent-emerald: #059669;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --shadow-glow: 0 10px 25px -5px rgba(168, 85, 247, 0.2);
      --glass-border: 1px solid rgba(168, 85, 247, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; transition: background 0.3s; }

    .glass-panel { background: var(--bg-card); backdrop-filter: blur(12px); border: var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 12px; }
    .glass-card { background: var(--bg-card); backdrop-filter: blur(10px); border: var(--glass-border); border-radius: 12px; transition: all 0.2s; }
    .glass-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow-glow); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-clos { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-installation { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-activation { background: rgba(6, 182, 212, 0.15); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-delivered { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-cancelled { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .badge-twal { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3); }

    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1500px; }
    .custom-table th { background: rgba(15, 23, 42, 0.4); padding: 10px 14px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); text-align: left; white-space: nowrap; }
    .custom-table td { padding: 10px 14px; font-size: 0.83rem; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
    .custom-table tr:hover td { background: var(--bg-card-hover); }
    .table-wrap { overflow-x: auto; border-radius: 12px; }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 3px; }
    .table-wrap::-webkit-scrollbar-thumb { background: rgba(192,38,211,0.4); border-radius: 3px; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: rgba(192,38,211,0.7); }
    .sticky-col { position: sticky; right: 0; background: var(--bg-secondary); z-index: 2; box-shadow: -3px 0 8px rgba(0,0,0,0.2); }
  </style>

    // Helper function to format raw Excel serial dates (e.g. 46216 -> 2026-07-13) or standard dates
    function formatExcelDate(val) {
      if (val === null || val === undefined || val === '' || val === '—' || val === 'null' || val === 'undefined') return '—';
      const str = String(val).trim();
      if (!str || str === '—') return '—';

      // Excel serial number (e.g. 46216, 46231, 46232)
      if (!isNaN(str) && !str.includes('-') && !str.includes('/')) {
        const num = parseFloat(str);
        if (num > 10000 && num < 100000) {
          const d = new Date(Math.round((num - 25569) * 86400 * 1000));
          if (!isNaN(d.getTime())) {
            return d.toISOString().split('T')[0];
          }
        }
      }

      // Handle standard date strings or slash dates (e.g. 2026-07-13 or 07/13/2026)
      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const yr = d.getFullYear();
        if (yr > 1990 && yr < 2100) {
          return d.toISOString().split('T')[0];
        }
      }

      return str;
    }

    // ── ExcelTab Component (Smart Deduplicating & Merging Excel Parser with Date Formatting) ──
    function ExcelTab({ orders, setOrders, isSuperAdmin }) {
      const [excelStatus, setExcelStatus] = React.useState(null);
      const fileInputRef = React.useRef(null);

      const handleFileUpload = (file) => {
        if (!file) return;
        const name = file.name.toLowerCase();
        if (!name.endsWith('.xlsx') && !name.endsWith('.xls') && !name.endsWith('.csv')) {
          setExcelStatus({ type: 'error', msg: 'Please select a valid Excel file (.xlsx, .xls) or CSV.' });
          return;
        }
        setExcelStatus({ type: 'loading', msg: `Reading & analyzing "${file.name}"...` });
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetNames = workbook.SheetNames || [];

            if (sheetNames.length === 0) {
              setExcelStatus({ type: 'error', msg: 'No sheets found in the selected Excel workbook.' });
              return;
            }

            const allParsedRows = [];

            sheetNames.forEach((sheetName) => {
              const sheetLower = sheetName.toLowerCase().trim();
              // Skip summary/reporting sheets
              if (sheetLower.includes('summary') || sheetLower.includes('pivot') || sheetLower.includes('dashboard')) {
                return;
              }

              const worksheet = workbook.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
              if (!rows || rows.length === 0) return;

              const isCancelledSheet = sheetLower.includes('cancel');

              rows.forEach((row, i) => {
                const get = (...keys) => {
                  for (const k of keys) {
                    const found = Object.keys(row).find(rk => rk.toLowerCase().replace(/[\s_\-]/g,'').includes(k.toLowerCase().replace(/[\s_\-]/g,'')));
                    if (found && row[found] !== undefined && row[found] !== '') return String(row[found]).trim();
                  }
                  return '';
                };

                const ki_id = get('ki id','kiid','kicid','orderid','id');
                const customer_name = get('customer name','customername','customer','client');
                const circuit_id = get('circuit id','circuitid','circuit');
                const sl_no = get('sl no','sl','sno','serial');

                // Skip blank or title padding rows
                if (!ki_id && !customer_name && !circuit_id && !sl_no) return;

                const final_ki_id = ki_id || `KIC-EXP-${allParsedRows.length + 1}`;
                const raw_status = get('order status','activestatus','workflowstatus') || get('status') || (isCancelledSheet ? 'Cancelled' : 'Under MW Installation');
                const order_status = raw_status.trim();
                const is_cancelled = isCancelledSheet ||
                  order_status.toLowerCase().includes('cancel') ||
                  ['true','yes','1'].includes(get('cancelled','iscancelled').toLowerCase());

                allParsedRows.push({
                  sl_no: sl_no || String(allParsedRows.length + 1),
                  ki_id: final_ki_id,
                  order_received: formatExcelDate(get('order received','orderreceived','date') || new Date().toISOString().split('T')[0]),
                  region: (get('region') || 'CENTRAL').toUpperCase(),
                  city: (get('city','location') || 'RIYADH').toUpperCase(),
                  customer_name: customer_name || 'Enterprise Client',
                  customer_contact: get('customer contact','customercontact','contact','phone','mobile'),
                  bw: get('bw','bandwidth','speed') || '10MBPs',
                  circuit_id: circuit_id,
                  order_number: get('order number','ordernumber','order no'),
                  los_performed: formatExcelDate(get('los performed','losperformed')),
                  los_status: get('los status','losstatus') || 'CLOS',
                  los_id: get('los id','losid'),
                  cwo_date: formatExcelDate(get('cwo date','cwodate','cwo')),
                  installation_start: formatExcelDate(get('installation start date','installationstart','start date')),
                  installation_complete: formatExcelDate(get('installation complete date','installationcomplete','complete date')),
                  delivery_date: formatExcelDate(get('delivery date','deliverydate','delivery')),
                  pole: get('pole'),
                  invoice: get('invoice'),
                  order_status: order_status,
                  assigned_to: get('assigned to','assignedto','engineer','assigned') || 'Unassigned',
                  priority: get('priority') || 'Medium',
                  remarks: get('remarks','notes','comment') || order_status,
                  is_cancelled: is_cancelled
                });
              });
            });

            if (allParsedRows.length === 0) {
              setExcelStatus({ type: 'error', msg: 'No order rows found in the uploaded Excel workbook.' });
              return;
            }

            // SMART MERGE & DEDUPLICATION ENGINE across all sheets
            let updatedCount = 0;
            let addedCount = 0;
            let currentList = [...orders];

            allParsedRows.forEach((row) => {
              const existingIdx = currentList.findIndex(o =>
                o.ki_id && row.ki_id && o.ki_id.toLowerCase().trim() === row.ki_id.toLowerCase().trim()
              );

              if (existingIdx !== -1) {
                const existing = currentList[existingIdx];
                currentList[existingIdx] = {
                  id: existing.id,
                  sl_no: row.sl_no || existing.sl_no,
                  ki_id: row.ki_id || existing.ki_id,
                  order_received: formatExcelDate(row.order_received) || formatExcelDate(existing.order_received),
                  region: row.region || existing.region,
                  city: row.city || existing.city,
                  circuit_id: row.circuit_id || existing.circuit_id,
                  order_number: row.order_number || existing.order_number,
                  customer_name: row.customer_name || existing.customer_name,
                  customer_contact: row.customer_contact || existing.customer_contact,
                  bw: row.bw || existing.bw,
                  los_performed: formatExcelDate(row.los_performed) || formatExcelDate(existing.los_performed),
                  los_status: row.los_status || existing.los_status,
                  los_id: row.los_id || existing.los_id,
                  cwo_date: formatExcelDate(row.cwo_date) || formatExcelDate(existing.cwo_date),
                  installation_start: formatExcelDate(row.installation_start) || formatExcelDate(existing.installation_start),
                  installation_complete: formatExcelDate(row.installation_complete) || formatExcelDate(existing.installation_complete),
                  delivery_date: formatExcelDate(row.delivery_date) || formatExcelDate(existing.delivery_date),
                  pole: row.pole !== undefined && row.pole !== '' ? row.pole : existing.pole,
                  invoice: row.invoice !== undefined && row.invoice !== '' ? row.invoice : existing.invoice,
                  order_status: row.order_status || existing.order_status,
                  assigned_to: row.assigned_to || existing.assigned_to,
                  priority: existing.priority || 'Medium',
                  remarks: row.remarks || row.order_status || existing.remarks,
                  is_cancelled: row.is_cancelled
                };
                updatedCount++;
              } else {
                currentList.push({
                  ...row,
                  id: 'ord-xl-' + Date.now() + '-' + Math.random().toString(36).substring(2,6)
                });
                addedCount++;
              }
            });

            // FINAL DEDUPLICATION & NUMERICAL SORT
            const uniqueMap = new Map();
            currentList.forEach(item => {
              const key = item.ki_id ? item.ki_id.toLowerCase().trim() : item.id;
              uniqueMap.set(key, item);
            });
            const finalList = Array.from(uniqueMap.values());
            const parseKiNum = (item) => {
              const match = (item.ki_id || '').match(/KIC-(\d+)/i);
              if (match) return parseInt(match[1], 10);
              const slNum = parseInt(item.sl_no, 10);
              return isNaN(slNum) ? 9999 : slNum;
            };
            finalList.sort((a, b) => parseKiNum(a) - parseKiNum(b));

            setOrders(finalList);
            setExcelStatus({
              type: 'success',
              msg: `✅ Excel Sheet Synced Successfully! Parsed ${sheetNames.length} sheet(s). ${updatedCount} existing circuits updated, ${addedCount} new circuits added. Total database size: ${finalList.length} circuits.`
            });

          } catch (err) {
            setExcelStatus({ type: 'error', msg: `Failed to parse Excel file: ${err.message}` });
          }
        };
        reader.onerror = () => setExcelStatus({ type: 'error', msg: 'Failed to read file.' });
        reader.readAsArrayBuffer(file);
      };

      const handleDrop = (e) => { e.preventDefault(); handleFileUpload(e.dataTransfer.files[0]); };

        const rows = orders.map(o => [o.sl_no,o.ki_id,formatExcelDate(o.order_received),o.region,o.city,o.customer_name,o.bw,o.los_status,formatExcelDate(o.cwo_date),formatExcelDate(o.installation_start),formatExcelDate(o.installation_complete),formatExcelDate(o.delivery_date),o.order_status,o.assigned_to,o.circuit_id,o.order_number,o.remarks].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], {type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'KI_Orders_Live_Database.csv'; a.click();
        URL.revokeObjectURL(url);
      };

      const statusStyle = excelStatus ? {
        padding: '1rem 1.25rem', borderRadius: '10px', fontWeight: 600, fontSize: '0.9rem',
        background: excelStatus.type === 'success' ? 'rgba(16,185,129,0.15)' : excelStatus.type === 'error' ? 'rgba(244,63,94,0.15)' : 'rgba(59,130,246,0.15)',
        border: `1px solid ${excelStatus.type === 'success' ? 'rgba(16,185,129,0.4)' : excelStatus.type === 'error' ? 'rgba(244,63,94,0.4)' : 'rgba(59,130,246,0.4)'}`,
        color: excelStatus.type === 'success' ? '#10b981' : excelStatus.type === 'error' ? '#f43f5e' : 'var(--accent-blue)',
        boxShadow: '0 4px 12px rgba(0,0,0,0.1)'
      } : null;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem' }}>
            <div>
              <h2 style={{ fontSize: '1.25rem', fontWeight: 800 }}>📑 Intelligent Excel Import & Synchronization Engine</h2>
              <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginTop: '0.2rem' }}>
                Upload updated project Excel sheets (.xlsx). Updates all existing columns, converts Excel serial dates to standard YYYY-MM-DD, adds missing circuits, and refreshes the Executive Dashboard live.
              </p>
            </div>
            <button onClick={handleExportCSV} style={{ padding: '0.55rem 1.25rem', background: 'linear-gradient(135deg, #10b981, #059669)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 700, fontSize: '0.85rem', cursor: 'pointer', boxShadow: '0 4px 12px rgba(16,185,129,0.3)' }}>
              📥 Export Live Database to CSV ({orders.length} orders)
            </button>
          </div>

          {excelStatus && <div style={statusStyle}>{excelStatus.msg}</div>}

          {!isSuperAdmin && (
            <div style={{ padding: '0.75rem 1rem', background: 'rgba(245, 158, 11, 0.15)', border: '1px solid rgba(245, 158, 11, 0.3)', borderRadius: '8px', color: '#f59e0b', fontSize: '0.82rem', fontWeight: 600 }}>
              ⚠️ Note: You are logged in with Read-Only permissions. Super Admin credentials are required to commit Excel data updates to the system.
            </div>
          )}

          <div
            className="glass-panel"
            onDragOver={(e) => e.preventDefault()}
            onDrop={handleDrop}

                        <option value="Engineer">Field Engineer (Assigned Projects Scope)</option>
                        <option value="Viewer">Viewer (Read-Only Scope)</option>
                        <option value="Super Admin">Super Admin (Full Control)</option>
                      </select>
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.3rem', color: 'var(--text-secondary)' }}>Email Address (Login Username) *</label>
                      <input required type="email" placeholder="e.g. tariq@kreativicon.com" value={newUser.email} onChange={(e) => setNewUser({ ...newUser, email: e.target.value })} style={{ width: '100%', padding: '0.55rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>

                    <div>
                      <label style={{ display: 'block', fontWeight: 700, marginBottom: '0.3rem', color: 'var(--text-secondary)' }}>Login Password *</label>
                      <input required type="text" placeholder="Set user account password" value={newUser.pass} onChange={(e) => setNewUser({ ...newUser, pass: e.target.value })} style={{ width: '100%', padding: '0.55rem', borderRadius: '6px', background: 'var(--bg-primary)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }} />
                    </div>
                  </div>

                  <button type="submit" style={{ marginTop: '1.5rem', width: '100%', padding: '0.75rem', background: 'linear-gradient(135deg, #a855f7 0%, #d946ef 100%)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: 800, fontSize: '0.9rem', cursor: 'pointer', boxShadow: '0 4px 14px rgba(168,85,247,0.35)' }}>
                    👤 Create & Activate User Account
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
