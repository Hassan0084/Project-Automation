version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kreativicon_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgres://kreativicon_user:secretpassword@postgres:5432/kreativicon_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: kreativicon_postgres
    restart: always
    environment:
      POSTGRES_DB: kreativicon_db
      POSTGRES_USER: kreativicon_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
